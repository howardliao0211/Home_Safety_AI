[project]
name = "home-safety-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "google-cloud-firestore>=2.20,<3",
  "google-cloud-storage>=3,<4",
  "pillow>=11,<13",
  "meta-sam-parser>=0.1,<1",
  "google-cloud-tasks>=2.19,<3",
  "firebase-admin>=7,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["emulator: requires local Firestore and GCS services", "live: sends a real request to the configured model"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
