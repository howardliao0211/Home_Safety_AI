services:
  auth:
    image: node:22-bookworm-slim
    working_dir: /emulator
    ports:
      - "127.0.0.1:9099:9099"
    volumes:
      - ./firebase.json:/emulator/firebase.json:ro
      - auth-data:/state
      - auth-npm:/root/.npm
    command: ["sh", "-c", "npx --yes firebase-tools@15.3.1 emulators:start --only auth --project $${GOOGLE_CLOUD_PROJECT:-home-safety-local} --import=/state --export-on-exit=/state"]
    stop_grace_period: 45s
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:cced7aefc06898a91efcfc942e6ab98537b3ec2d15d66ec54cffa62ac6d7f19b
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-home-safety-local}
    volumes:
      - firestore-data:/state
      - ./scripts/firestore-emulator.py:/run-firestore.py:ro
    entrypoint: ["python3", "/run-firestore.py"]
    stop_grace_period: 45s
  photos:
    image: fsouza/fake-gcs-server:1.52.3@sha256:666f86b873120818b10a5e68d99401422fcf8b00c1f27fe89599c35236f48b4c
    ports:
      - "127.0.0.1:4443:4443"
    command: ["-scheme", "http", "-port", "4443", "-backend", "filesystem", "-filesystem-root", "/storage", "-external-url", "http://127.0.0.1:4443"]
    volumes:
      - photos-data:/storage

volumes:
  auth-data:
  auth-npm:
  firestore-data:
  photos-data:
